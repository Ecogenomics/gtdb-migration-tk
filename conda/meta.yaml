{% set data = load_setup_py_data(setup_file='../setup.py', from_recipe_dir=True) %}

package:
  name: gtdb_migration_tk
  version: {{ data['version'] }}

source:
  url: https://github.com/Ecogenomics/gtdb-migration-tk/archive/{{ data['version'] }}.tar.gz

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - python >=3.8
    - pip
  run:
    - python >=3.8
    - requests >=2.27.1
    - unidecode >=1.3.4
    - biolib >=0.1.8
    - gtdblib >=1.10.1
    - pandas >=1.4.1
    - numpy >=1.22.3
    - sqlalchemy >=1.4.45
    - beautifulsoup4 >=4.11.1
    - dendropy >=4.5.2
    - tqdm >=4.63.0
    - atpbar >=1.1.4
    - python-dateutil >=2.8.2
    - psycopg2 >=2.9.3

test:
  imports:
    - gtdb_migration_tk
  commands:
    - gtdb_migration_tk -h

about:
  home: https://github.com/Ecogenomics/gtdb-migration-tk
  summary: 'Toolkit for updating the GTDB to the next release and test data.'
